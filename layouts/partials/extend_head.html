{{- /* PaperMod hook: load MathJax only on pages that set `math: true` in front matter */ -}}
{{- if .Params.math }}
<script>
  MathJax = {
    tex: {
      inlineMath: [['\\(', '\\)']],
      displayMath: [['\\[', '\\]'], ['$$', '$$']],
      packages: { '[+]': ['color'] }
    },
    loader: { load: ['[tex]/color'] },
    chtml: { displayOverflow: 'scroll' }
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<style>
  /* long display formulas scroll sideways on phones instead of overflowing the column */
  mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
</style>
{{- end }}

{{- /* Cloudflare Web Analytics: production builds only, so `hugo server` previews are never counted */ -}}
{{- if hugo.IsProduction }}
<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "49f033d119314c62be664075e5e0d58c"}'></script>
{{- end }}
